name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify installation and CLI
        run: |
          python install.py --config-dir "$RUNNER_TEMP/opencode-install"
          python "$RUNNER_TEMP/opencode-install/skills/f5-migration/scripts/f5_migration.py" --help
